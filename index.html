<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b4f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="CF Tracker"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>CF Tracker</title>
<style>
:root{--bg:#f3f5f2;--fg:#17211b;--card:#fff;--mut:#66736b;--acc:#0f6b4f;--bad:#b3261e;--ok:#1b7a3d;--warn:#8a5a00;--ln:#dde3de;--pl:#6a4bb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(58px + env(safe-area-inset-bottom,0px));}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--fg:#e8efe9;--card:#18201b;--mut:#93a29a;--acc:#4fc79a;--bad:#ff8a80;--ok:#7bd89a;--warn:#f0c060;--ln:#2a352e;--pl:#b79cf5}}
:root[data-theme="dark"]{--bg:#101613;--fg:#e8efe9;--card:#18201b;--mut:#93a29a;--acc:#4fc79a;--bad:#ff8a80;--ok:#7bd89a;--warn:#f0c060;--ln:#2a352e;--pl:#b79cf5}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 "Segoe UI",system-ui,Roboto,sans-serif;max-width:640px;margin:auto;padding:0 12px 12px}
h2{font:600 20px Georgia,serif;margin:14px 0 8px}h3{font-size:15px;margin:14px 0 6px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:8px 0}
.big{font:600 32px Georgia,serif}.m{color:var(--mut);font-size:13px}.r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button,textarea{font:inherit;width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--fg)}
button{background:var(--acc);color:var(--bg);border:0;font-weight:600;cursor:pointer}button.s{background:transparent;color:var(--acc);border:1px solid var(--acc);padding:4px 8px;width:auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:auto}
nav a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--mut);cursor:pointer}nav a.on{color:var(--acc);font-weight:700;border-top:2px solid var(--acc)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.w{color:var(--warn);font-weight:600}.pl{color:var(--pl)}.v{opacity:.45;text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px;border-bottom:1px solid var(--ln);text-align:left}td:last-child,th:last-child{text-align:right}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body><div id="app"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=c=>(c<0?'-':'')+'₱'+(Math.abs(c)/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const toC=v=>Math.round(parseFloat(String(v).replace(/,/g,''))*100)||0;
const fmt=c=>(c/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),fv=c=>c?fmt(c):'';
function fa(el){let v=el.value.replace(/[^0-9.]/g,'');const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'').slice(0,2);const[a,b]=v.split('.');el.value=(a?(+a).toLocaleString('en-US'):(i>=0?'0':''))+(b!==undefined?'.'+b:'')}
function fb(el){if(el.value)el.value=fmt(toC(el.value))}
const dm=x=>new Date(x+'T00:00').toLocaleDateString('en-PH',{day:'numeric',month:'short'}),ad=(x,n)=>{const d=new Date(x+'T00:00');d.setDate(d.getDate()+n);return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const AM='inputmode="decimal" oninput="fa(this)" onblur="fb(this)"',fnames=()=>[...new Set(S.accts.map(a=>a.fund))];
const ymd=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const today=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-PH',{day:'numeric',month:'short',year:'numeric'}):'—';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const dd=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
function period(s){const[y,m]=s.split('-').map(Number);return +s.slice(8)<=15?[ymd(y,m,1),ymd(y,m,15)]:[ymd(y,m,16),ymd(y,m,new Date(y,m,0).getDate())]}
function prevP(p){const[y,m,d]=p[0].split('-').map(Number);if(d===16)return[ymd(y,m,1),ymd(y,m,15)];const pm=m===1?12:m-1,py=m===1?y-1:y;return[ymd(py,pm,16),ymd(py,pm,new Date(py,pm,0).getDate())]}
const mk=()=>({v:1,accts:[{id:'cash',name:'Cash on hand',fund:'Allowance',open:0},{id:'bank',name:'Cash in bank',fund:'Allowance',open:0}],
cats:['Food and meals','Transportation','School','Groceries','Bills and utilities','Personal care','Entertainment','Shopping','Health and misc'],
tx:[],plans:[],set:{expDate:'',expAmt:0,actDate:'',actAmt:0,minBal:0,buf:50000}});
let S=mk(),V='home',D={type:'expense'},R={f:'',t:'',out:''},E={m:'cat',o:0},db;
/* storage: IndexedDB */
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('bt',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function load(){return new Promise(r=>{if(!db)return r();try{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>{if(q.result)S=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
let NS=false;function save(k){if(NS)return;try{db&&db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(k?k.v:S)),k?k.key:'s')}catch(e){}}
/* ledger core: integer centavos, balance always derived from ledger */
const A=id=>S.accts.find(a=>a.id===id),isA=id=>id==='cash'||id==='bank';
const lab=id=>{const a=A(id);return a?(a.fund===a.name?a.name:a.fund+' · '+a.name):'—'};
function flow(id){let i=0,o=0;for(const t of S.tx)if(!t.void){if(t.to===id)i+=t.amt;if(t.from===id)o+=t.amt}return{i,o}}
const bal=id=>{const f=flow(id);return A(id).open+f.i-f.o},alw=()=>bal('cash')+bal('bank');
function addTx(o){const t={id:uid(),date:today(),desc:'',cat:'',note:'',created:Date.now(),modified:Date.now(),void:false,hist:[{at:Date.now(),act:'create'}],...o};S.tx.push(t);save();return t}
const inR=(f,t)=>S.tx.filter(x=>!x.void&&x.date>=f&&x.date<=t);
function spend(f,t,flt){let g=0,r=0;for(const x of inR(f,t)){if(flt&&!flt(x))continue;if(x.type==='expense')g+=x.amt;if(x.type==='refund')r+=x.amt}return{g,r,n:g-r}}
const allow=x=>isA(x.from)||isA(x.to);
function convertPlan(id){const p=S.plans.find(x=>x.id===id);if(!p||p.paid)return;const t=addTx({type:'expense',amt:p.amt,from:p.acct,cat:p.cat,desc:p.desc,plan:p.id});p.paid=true;p.tx=t.id;save();render()}
const unpaid=()=>S.plans.filter(p=>!p.paid),reserved=()=>unpaid().filter(p=>p.res&&isA(p.acct)).reduce((a,p)=>a+p.amt,0);
/* views */
const opts=(sel,onlyA)=>S.accts.filter(a=>!onlyA||isA(a.id)).map(a=>`<option value="${a.id}"${a.id===sel?' selected':''}>${esc(lab(a.id))}</option>`).join('');
const arch=()=>S.arch||(S.arch=[]),act=()=>S.cats.filter(c=>!arch().includes(c)),usedC=c=>S.tx.some(t=>t.cat===c)||S.plans.some(p=>p.cat===c);
const catOpts=s=>{const l=S.cats.filter(c=>!arch().includes(c)||c===s);return(l.length?'':'<option value="">Uncategorized</option>')+l.map(c=>`<option${c===s?' selected':''}>${esc(c)}</option>`).join('')};
const TL={income:'Income',expense:'Expense',transfer:'Transfer',refund:'Refund'};
function txRow(x){const sg=x.type==='expense'?'-':x.type==='transfer'?'':'+';return`<div class="c ${x.void?'v':''}"><div class="r"><b>${esc(x.desc||TL[x.type])}</b><b class="${x.type==='expense'?'bad':x.type==='transfer'?'':'ok'}">${sg}${P(x.amt)}</b></div><div class="m">${fd(x.date)} · ${TL[x.type]}${x.cat?' · '+esc(x.cat):''} · ${x.from?esc(lab(x.from)):''}${x.from&&x.to?' → ':''}${x.to?esc(lab(x.to)):''}${x.plan?' · from plan':''}</div>${x.void?'':`<button class="s" onclick="editTx('${x.id}')">Edit</button> `}<button class="s" onclick="vt('${x.id}')">${x.void?'Restore':'Void'}</button></div>`}
function vt(id){const t=S.tx.find(x=>x.id===id);t.void=!t.void;t.modified=Date.now();t.hist.push({at:Date.now(),act:t.void?'void':'restore'});save();render()}
const views={
home(){const cp=period(today()),n=S.tx.length;return`<h2>Allowance</h2><div class="c"><div class="m">Total allowance (ledger)</div><div class="big">${P(alw())}</div>
<div class="g"><div><div class="m">Cash on hand</div><b>${P(bal('cash'))}</b></div><div><div class="m">Cash in bank</div><b>${P(bal('bank'))}</b></div></div></div>
<div class="g"><button onclick="D.type='expense';go('add')">+ Expense</button><button onclick="D.type='transfer';go('add')">Transfer</button></div>
<div class="c"><div class="r"><span>Current cutoff</span><b>${fd(cp[0])} – ${fd(cp[1])}</b></div><div class="r"><span>Expected allowance</span><b>${P(S.set.expAmt)} on ${fd(S.set.expDate)}</b></div><div class="m">Expected money is not counted in your balance until you record receipt.</div></div>
<div class="m">Works offline. Data lives only on this phone (IndexedDB). Use Data → backup regularly.</div>
<h3>Recent</h3>${n?S.tx.slice(-5).reverse().map(txRow).join(''):'<div class="c m">No transactions yet. Set opening balances under Funds, then add your first entry.</div>'}`},
add(){const t=D.type,e=t==='expense'||t==='refund',ed=D.edit;return`<h2>${ed?'Edit transaction':'Add transaction'}</h2><div class="c"><select id="f_type" ${ed?'disabled':''} onchange="snap();render()">${Object.keys(TL).map(k=>`<option value="${k}"${k===t?' selected':''}>${TL[k]}</option>`).join('')}</select>
<input id="f_amt" ${AM} placeholder="Amount ₱ (e.g. 150.00)" value="${esc(D.amt||'')}"><input id="f_desc" placeholder="Description" value="${esc(D.desc||'')}">
${e?`<select id="f_cat">${catOpts(D.cat)}</select>`:''}
${t!=='income'&&t!=='refund'?`<label class="m">From</label><select id="f_from">${opts(D.from||'cash')}</select>`:''}
${t!=='expense'?`<label class="m">${t==='transfer'?'To':'Into'}</label><select id="f_to">${opts(D.to||'bank')}</select>`:''}
<input id="f_date" type="date" value="${D.date||today()}"><input id="f_note" placeholder="Note (optional)" value="${esc(D.note||'')}">
<div class="w">${esc(D.warn||'')}</div><button onclick="saveTx()">${D.warn?'Save anyway':ed?'Save changes':'Save'}</button>${ed?'<button class="s" style="width:100%" onclick="cancelEdit()">Cancel</button>':''}</div>`},
ledger(){const m=E.m||'cat',b=(k,t)=>`<button ${m===k?'':'class="s" style="width:100%"'} onclick="E.m='${k}';render()">${t}</button>`;return`<h2>Expenses</h2><div class="g">${b('cat','By category')}${b('tx','Transactions')}</div>${m==='cat'?catView():txView()}`},
funds(){const nm=fnames(),ex=S.accts.filter(a=>!isA(a.id)).length;return`<h2>Funds</h2>${nm.map((n,i)=>{const ac=S.accts.filter(a=>a.fund===n);return`<div class="c" style="cursor:pointer" tabindex="0" onclick="openFund(${i})"><div class="r"><b>${esc(n)}</b><b>${P(ac.reduce((q,a)=>q+bal(a.id),0))}</b></div>${ac.length>1?ac.map(a=>`<div class="r m"><span>${esc(a.name)}</span><span>${P(bal(a.id))}</span></div>`).join(''):''}<div class="m">Tap to open</div></div>`}).join('')}
<div class="c"><div class="r"><span>All funds total</span><b>${P(S.accts.reduce((a,x)=>a+bal(x.id),0))}</b></div></div>
${ex<4?`<div class="c"><b>Add fund</b> <span class="m">(${ex} of 4 extra funds used)</span><input id="nf" placeholder="Fund name"><input id="nfo" ${AM} placeholder="Opening balance ₱"><button onclick="addFund()">Add fund</button></div>`:'<div class="m">Maximum of five funds reached.</div>'}
<button onclick="go('cats')">Manage expense categories</button>`},
fund(){const n=fnames()[D.fi];if(n===undefined)return views.funds();const ac=S.accts.filter(a=>a.fund===n),ids=ac.map(a=>a.id);let i=0,o=0;for(const x of S.tx){if(x.void)continue;const ti=ids.includes(x.to),fi=ids.includes(x.from);if(ti&&!fi)i+=x.amt;if(fi&&!ti)o+=x.amt}
const list=S.tx.filter(x=>ids.includes(x.from)||ids.includes(x.to)).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
return`<button class="s" onclick="go('funds')">← All funds</button><h2>${esc(n)}</h2><div class="c"><div class="m">Balance</div><div class="big">${P(ac.reduce((q,a)=>q+bal(a.id),0))}</div><div class="r"><span>Money in</span><b class="ok">${P(i)}</b></div><div class="r"><span>Money out</span><b class="bad">${P(o)}</b></div><div class="m">Moves between this fund’s own accounts are not counted.</div></div>
${ac.map(a=>`<div class="c"><div class="r"><b>${esc(a.name)}</b><b>${P(bal(a.id))}</b></div><label class="m">Opening balance ₱ (not income)</label><input ${AM} value="${fmt(a.open)}" onchange="setOpen('${a.id}',this.value)"></div>`).join('')}
${isA(ac[0].id)?'':`<div class="c"><label class="m">Fund name</label><input value="${esc(n)}" onchange="renFund(${D.fi},this.value)"><button class="s" onclick="delFund(${D.fi})">Delete fund (only if empty)</button></div>`}
<h3>History</h3>${list.length?list.map(txRow).join(''):'<div class="c m">No transactions for this fund yet.</div>'}`},
cats(){const a=arch();return`<button class="s" onclick="go('funds')">← Funds</button><h2>Expense categories</h2><div class="c"><div class="m">Rename, add or remove. Used categories are hidden (not deleted) so old reports stay correct.</div>
${S.cats.map((c,i)=>a.includes(c)?'':`<div class="r"><input value="${esc(c)}" onchange="renCat(${i},this.value)" aria-label="Category name"><button class="s" style="margin:4px 0" onclick="remCat(${i})">Remove</button></div>`).join('')||'<div class="m">No categories. Add one below.</div>'}
<input id="nc" placeholder="New category"><button onclick="addCat()">Add category</button></div>
${S.cats.some(c=>!a.includes(c))?'<button class="s" style="width:100%" onclick="remAll()">Remove all unused categories</button>':''}
${a.length?`<h3>Hidden</h3><div class="c">${S.cats.map((c,i)=>a.includes(c)?`<div class="r"><span>${esc(c)}</span><button class="s" onclick="resCat(${i})">Restore</button></div>`:'').join('')}</div>`:''}`},
plan(){const s=S.set,al=alw(),res=reserved(),pu=unpaid().filter(p=>isA(p.acct)).reduce((a,p)=>a+p.amt,0);return`<h2>Next Cutoff Budget</h2>
<div class="c"><b>Allowance receipt</b><div class="m">Expected and actual are kept separately.</div><label class="m">Expected date</label><input type="date" value="${s.expDate}" onchange="setS('expDate',this.value)"><label class="m">Expected amount ₱</label><input ${AM} value="${fv(s.expAmt)}" onchange="setS('expAmt',this.value,1)">
<label class="m">Actual date received</label><input type="date" value="${s.actDate}" onchange="setS('actDate',this.value)"><label class="m">Actual amount ₱</label><input ${AM} value="${fv(s.actAmt)}" onchange="setS('actAmt',this.value,1)">
<div class="m">${s.expDate&&s.actDate?'Delay: '+dd(s.expDate,s.actDate)+' day(s)':''}</div><button onclick="recv()">Record received into bank</button></div>
<div class="c"><b>Summary</b> <span class="m">(allowance funds)</span><div class="r"><span>Actual balance</span><b>${P(al)}</b></div><div class="r pl"><span>Reserved (earmark)</span><b>${P(res)}</b></div><div class="r"><span>Spendable (balance − reserved)</span><b>${P(al-res)}</b></div><div class="r pl"><span>Planned, unpaid</span><b>${P(pu)}</b></div><div class="r"><span>Projected ending (no new money)</span><b class="${al-pu<0?'bad':''}">${P(al-pu)}</b></div><div class="r"><span>Expected, not yet received</span><b>${P(s.expAmt)}</b></div><div class="m">Reserved money is part of planned expenses, so it is subtracted once in the projection.</div></div>
<div class="c"><b>Planned expense</b><input id="p_d" placeholder="Description"><input id="p_a" ${AM} placeholder="Amount ₱"><input id="p_dt" type="date"><select id="p_c">${catOpts()}</select><select id="p_ac">${opts('cash')}</select><label><input type="checkbox" id="p_r" style="width:auto"> Reserve this amount</label><button onclick="addPlan()">Add plan</button></div>
${S.plans.map(p=>`<div class="c ${p.paid?'v':''}"><div class="r"><b class="pl">${esc(p.desc)}</b><b>${P(p.amt)}</b></div><div class="m">${fd(p.date)} · ${esc(p.cat)} · ${esc(lab(p.acct))}${p.res?' · reserved':''}${p.paid?' · paid':''}</div>${p.paid?'':`<button class="s" onclick="convertPlan('${p.id}')">Mark paid → create expense</button> <button class="s" onclick="delPlan('${p.id}')">Remove</button>`}</div>`).join('')}
<div class="c"><b>Thresholds</b><label class="m">Minimum balance ₱</label><input ${AM} value="${fv(s.minBal)}" onchange="setS('minBal',this.value,1)"><label class="m">Comfort buffer above minimum ₱</label><input ${AM} value="${fv(s.buf)}" onchange="setS('buf',this.value,1)"></div>`},
reports(){const c=period(today());R.f=R.f||c[0];R.t=R.t||c[1];const sel=R.funds||['Allowance'],B=S.bud||{},st=S.set,bt='class="s" style="width:100%"';return`<h2>Reports</h2><div class="m">Nothing is generated until you tap a button.</div>
<div class="c"><b>Period</b><div class="g"><button ${bt} onclick="pre('first')">First cutoff</button><button ${bt} onclick="pre('second')">Second cutoff</button><button ${bt} onclick="pre('cur')">Current cutoff</button><button ${bt} onclick="pre('prev')">Previous cutoff</button></div>
<div class="g"><input type="date" id="r_f" value="${R.f}" onchange="R.f=this.value" aria-label="From"><input type="date" id="r_t" value="${R.t}" onchange="R.t=this.value" aria-label="To"></div>
<button onclick="rep()">Generate expense report</button><button onclick="ovr()">Analyze spending</button><button onclick="cmp()">Compare cutoffs</button><button ${bt} onclick="xl()">Export to Excel (.xlsx)</button></div>
<div class="c"><b>Allowance sufficiency</b><div class="m">Funds to include. Default is Allowance only.</div>${fnames().map((n,i)=>`<label class="r"><span>${esc(n)}</span><input type="checkbox" style="width:auto" ${sel.includes(n)?'checked':''} onchange="togF(${i},this.checked)"></label>`).join('')}<button onclick="fc()">Check allowance sufficiency</button></div>
<details class="c"><summary><b>Report settings</b></summary>
<label class="m">Completed cutoffs used for averages and forecasts</label><select onchange="setH(this.value)">${[1,2,3,4,5,6].map(n=>`<option${n===(st.hist||3)?' selected':''}>${n}</option>`).join('')}</select>
<label class="r"><span>Include current unfinished cutoff (counted only for days elapsed)</span><input type="checkbox" style="width:auto" ${st.incl?'checked':''} onchange="setIncl(this.checked)"></label>
<label class="m">Flag spending faster than history by more than (%)</label><input inputmode="numeric" value="${st.dev??25}" onchange="setDev(this.value)">
<div class="m">Cutoffs with no transactions are skipped, not counted as zero spending.</div>
<b>Category budgets per cutoff (₱)</b>${act().map(cn=>`<div class="r"><span>${esc(cn)}</span><input style="width:45%" ${AM} value="${fv(B[cn]||0)}" onchange="setBud(${S.cats.indexOf(cn)},this.value)" aria-label="Budget for ${esc(cn)}"></div>`).join('')}</details>${R.out}`},
data(){return`<h2>Data</h2><div class="c"><button onclick="showJ()">Show full backup (JSON)</button><button onclick="showC()">Show ledger CSV</button><button onclick="tests()">Run accounting self-test</button>
<textarea id="box" rows="9" placeholder="Output appears here. To restore, paste a backup JSON and tap Restore."></textarea><button onclick="restore()" id="rb">Restore from pasted JSON</button><div id="dm" class="w"></div></div><div class="m">Restore saves your current data under a separate IndexedDB key first.</div>`}};
const NAV=[['home','Home'],['add','Add'],['ledger','Spend'],['funds','Funds'],['plan','Plan'],['reports','Reports'],['data','Data']];
function render(){$('#app').innerHTML=views[V]();$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]===(V==='fund'||V==='cats'?'funds':V)?'on':''}" tabindex="0" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}
function go(v){V=v;render();scrollTo(0,0)}
function snap(){for(const k of['type','amt','desc','cat','from','to','date','note']){const e=$('#f_'+k);if(e)D[k]=e.value}}
function saveTx(){snap();const amt=toC(D.amt),t=D.type;if(amt<=0){D.warn='Enter an amount greater than 0.';return render()}

H.forEach(x=>{const c=catNet(x.p[0],x.p[1]);for(const k in c)hc[k]=(hc[k]||0)+c[k]});
if(one)for(const[k,b]of Object.entries(B)){const v=cur[k]||0,pc=Math.round(v/el*full);if(v>b)al.push(['bad',`${k}: ${P(v)} spent, ${P(v-b)} over the ${P(b)} budget`,`Rule: category spending is above the budget you set (${P(b)} per cutoff).`]);else if(!done&&v>0&&pc>b)al.push(['w',`${k}: on pace for about ${P(pc)} against a ${P(b)} budget`,`Rule: ${P(v)} spent over ${el} of ${full} days, extended to the full cutoff, exceeds the budget.`])}
if(H.length){for(const[k,v]of Object.entries(cur)){const ha=(hc[k]||0)/hd,r=v/el;if(v>0&&ha>0&&r>ha*(1+T))al.push(['w',`${k}: ${P(Math.round(r))}/day vs usual ${P(Math.round(ha))}/day (+${Math.round((r/ha-1)*100)}%)`,`Rule: daily spending is more than ${dv}% above the average of the ${H.length} completed cutoff(s) before this period.`])}
const th=H.reduce((a,x)=>a+x.n,0)/hd,tr=tot/el;if(th>0&&tr>th*(1+T))al.push(['w',`Total: ${P(Math.round(tr))}/day vs usual ${P(Math.round(th))}/day (+${Math.round((tr/th-1)*100)}%)`,`Rule: overall daily spending is more than ${dv}% above the historical average.`])}
const sf=suff(S.accts.filter(a=>a.fund==='Allowance').map(a=>a.id));if(sf.ok){const x=sf.sc[1];if(x.l!=='Comfortable')al.push([x.l==='Tight'?'w':'bad',`Next cutoff: ${x.l}, projected ${P(x.pr)} at receipt`,`Rule: expected scenario of the allowance check against your minimum balance (${P(sf.m)}) and buffer (${P(sf.b)}).`])}
R.out=`<div class="c"><b>Spending analysis</b> <span class="m">${fd(f)} – ${fd(t)}</span><div class="m">Compared with ${one&&Object.keys(B).length?'your budgets and ':''}${H.length?H.length+' earlier completed cutoff(s)':'no earlier history (nothing recorded to compare)'}.</div></div>${al.length?al.map(a=>`<div class="c"><b class="${a[0]}">${esc(a[1])}</b><div class="m">${esc(a[2])}</div></div>`).join(''):'<div class="c ok">No alerts under these rules.</div>'}${!one&&Object.keys(B).length?'<div class="m">Budgets are compared only when the range is exactly one cutoff.</div>':''}`;render()}
function fc(){const sel=R.funds||['Allowance'],ids=S.accts.filter(a=>sel.includes(a.fund)).map(a=>a.id);if(!ids.length){R.out='<div class="c w">Select at least one fund.</div>';return render()}const r=suff(ids),hn=S.set.hist||3;
let o=`<div class="c"><b>Allowance sufficiency</b> <span class="m">(estimate, not a guarantee)</span><div class="m">Funds: ${esc(sel.join(', '))}${sel.some(n=>n!=='Allowance')?' (other funds treated as available money)':''}</div><div class="r"><span>Available now</span><b>${P(r.av)}</b></div><div class="r"><span>Reserved</span><b>${P(r.res)}</b></div><div class="r"><span>Expected, not received</span><b>${P(S.set.expAmt)} on ${fd(r.e)}</b></div>`;
if(!r.ok){R.out=o+`<div class="w">${!r.e?'Set the expected receipt date in Plan. ':''}${!r.H.length?'No completed cutoff with recorded transactions yet, so daily spending can’t be estimated.':''}</div></div>`;return render()}
R.out=o+`<div class="r"><span>History used</span><span>${r.H.length} cutoff(s)${r.H.length<hn?' (fewer than '+hn+')':''}${r.H.some(x=>x.part)?', incl. current so far':''}</span></div><div class="r"><span>Est. daily spending</span><b>${P(Math.round(r.avg))}</b></div><div class="r"><span>Days to receipt</span><b>${r.days}</b></div><div class="r"><span>Planned, unpaid, before receipt</span><b>${P(r.pl)}</b></div><div class="r"><span>Daily capacity above minimum</span><b>${P(r.cap)}</b></div>
<table><tr><th>Scenario</th><th>Projected balance</th></tr>${r.sc.map(x=>`<tr><td>${x.n}</td><td class="${x.l==='Comfortable'?'ok':x.l==='Tight'?'w':'bad'}">${P(x.pr)} · ${x.l}</td></tr>`).join('')}</table>
<div class="m">Projected = available − planned − est. daily × days. Comfortable ≥ minimum + buffer; Tight ≥ minimum; else Shortfall risk. Planned items may overlap with the average, so this leans cautious. Expected allowance is excluded.</div></div>`;render()}
function showJ(){$('#box').value=JSON.stringify({format:'budget-tracker',version:1,exported:new Date().toISOString(),state:S},null,1)}
function showC(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';$('#box').value=['id,date,type,from,to,category,description,amount_php,voided',...S.tx.map(t=>[t.id,t.date,t.type,t.from?lab(t.from):'',t.to?lab(t.to):'',t.cat,t.desc,(t.amt/100).toFixed(2),t.void].map(q).join(','))].join('\n')}
let rc=0;function restore(){try{const j=JSON.parse($('#box').value);if(j.format!=='budget-tracker'||j.version!==1||!Array.isArray(j.state?.tx)||!Array.isArray(j.state?.accts))throw 0;if(!rc){rc=1;$('#dm').textContent=`Backup has ${j.state.tx.length} transactions. This replaces current data. Tap Restore again to confirm.`;return}save({key:'prev',v:S});S=j.state;save();rc=0;go('home')}catch(e){rc=0;$('#dm').textContent='Invalid or unsupported backup. Nothing was changed.'}}

addTx({type:'income',amt:500000,to:'bank'});addTx({type:'transfer',amt:150000,from:'bank',to:'cash'});const e=addTx({type:'expense',amt:12000,from:'cash',cat:'Food and meals'});
ok('A: bank ₱3,500',bal('bank')===350000);ok('A: cash ₱1,380',bal('cash')===138000);ok('A: allowance ₱4,880',alw()===488000);
const sp=spend('0000-01-01','9999-12-31');ok('A: expenses ₱120 (transfer excluded)',sp.g===12000);
S.accts.push({id:'sv',name:'Savings',fund:'Savings',open:100000});const tot=()=>S.accts.reduce((a,x)=>a+bal(x.id),0),t0=tot();addTx({type:'transfer',amt:50000,from:'sv',to:'cash'});
ok('B: savings −₱500',bal('sv')===50000);ok('B: total unchanged',tot()===t0);
S.plans.push({id:'p',desc:'Fare',amt:30000,acct:'cash',cat:'Transportation',res:true,paid:false});const b0=alw();ok('C: plan leaves balance',alw()===b0&&reserved()===30000);
convertPlan('p');convertPlan('p');ok('C: converted once (−₱300)',alw()===b0-30000&&reserved()===0);
vt(e.id);ok('Void restores ₱120',alw()===b0-30000+12000);vt(e.id);ok('Restore re-applies',alw()===b0-30000);
addTx({type:'refund',amt:12000,to:'cash'});ok('Refund nets expense',spend('0000-01-01','9999-12-31').n===30000);
S=mk();S.accts[0].open=100000;const td=today(),ps=[];let pp=prevP(period(td));for(let i=0;i<3;i++){ps.push(pp);pp=prevP(pp)}[15000,9000,6000].forEach((a,i)=>addTx({type:'expense',amt:a,from:'cash',date:ps[i][0],cat:'Food and meals'}));S.set.expDate=ad(td,10);
const dys=ps.reduce((a,q)=>a+dd(q[0],q[1])+1,0),av=30000/dys,fq=suff(['cash','bank']);
ok('Forecast: uses 3 completed cutoffs',fq.ok&&fq.H.length===3&&Math.abs(fq.avg-av)<1e-9);ok('Forecast: expected projection',fq.sc[1].pr===Math.round(alw()-av*10));
S.set.hist=2;ok('History window changes to 2',suff(['cash','bank']).H.length===2);S.set.hist=3;
S=mk();S.set.expDate=ad(td,5);ok('Forecast: no history is not zero spending',suff(['cash','bank']).ok===false);
S=bak;NS=false;render();$('#box').value=r.join('\n')}
